services:
  - type: web
    name: restaurant-app-backend
    runtime: java
    rootDir: restaurant-app/restaurant-app
    buildCommand: "./mvnw package -DskipTests"
    startCommand: "java -jar target/restaurant-app-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update